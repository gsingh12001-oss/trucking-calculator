<!DOCTYPE html>
<html>
<head>
    <title>Trucking Profit Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h3 {
            color: #555;
            border-bottom: 2px solid #007bff;
            padding-bottom: 5px;
        }
        label {
            display: block;
            margin-top: 15px;
            color: #666;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>🚚 Trucking Profit Calculator</h1>
    
    <form action="/calculate" method="POST">
        <h3>Revenue</h3>
        <label>Monthly Revenue ($):</label>
        <input type="number" step="0.01" name="revenue" required>
        
        <h3>Fixed Expenses</h3>
        <label>Truck Payment ($):</label>
        <input type="number" step="0.01" name="truck_payment" required>
        
        <label>Trailer Payment ($):</label>
        <input type="number" step="0.01" name="trailer_payment" required>
        
        <label>Insurance ($):</label>
        <input type="number" step="0.01" name="insurance" required>
        
        <h3>Variable Expenses</h3>
        <label>Fuel ($):</label>
        <input type="number" step="0.01" name="fuel" required>
        
        <label>Driver Pay ($):</label>
        <input type="number" step="0.01" name="driver_pay" required>
        
        <label>Factoring (%):</label>
        <input type="number" step="0.01" name="factoring_percent" required>
        
        <label>Dispatch (%):</label>
        <input type="number" step="0.01" name="dispatch_percent" required>
        
        <label>Repair & Maintenance ($):</label>
        <input type="number" step="0.01" name="repair_maintenance" required>
        
        <label>Tolls ($):</label>
        <input type="number" step="0.01" name="tolls" required>
        
        <label>Other ($):</label>
        <input type="number" step="0.01" name="other" required>
        
        <button type="submit">Calculate Profit</button>
    </form>
</body>
</html>
